[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpi-heal"
version = "1.0.0"
description = "Autonomous Self-Healing Middleware Swarm for Digital Public Infrastructure (UPI / OCEN / DigiLocker)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Distributed Systems & Agentic AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "z3-solver>=4.12.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
dpi-heal = "main:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
